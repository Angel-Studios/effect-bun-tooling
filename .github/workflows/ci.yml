name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: tsc
        run: bun run tsc

      - name: test
        run: bun run test:unit:once

      - name: biome
        run: bun run check:ci

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: pack every publishable package
        run: bun scripts/pack-workspace.ts

      - name: prove a consumer resolves the packed tarballs with no lockfile, and inspect the archives
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist-tarballs/*.tgz
