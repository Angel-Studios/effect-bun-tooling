name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: the existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: check out the tag being released, which a workflow_dispatch does not do by default
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: the tag must name the version every manifest carries
        run: bun scripts/assert-tag-version.ts "${RELEASE_TAG}"

      - name: dod
        run: bun run dod

      - name: pack every publishable package
        run: bun scripts/pack-workspace.ts

      - name: prove a consumer resolves these tarballs, and inspect the archives, before any upload
        run: bun run test:e2e

      - name: create the GitHub Release only when the tag does not already have one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 \
            || gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes

      - name: attach the tarballs to the Release, replacing anything an earlier run uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" ./dist-tarballs/*.tgz --clobber
