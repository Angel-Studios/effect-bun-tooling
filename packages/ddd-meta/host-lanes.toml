# Declared host-validity lanes for __tests__/host-validity.test.ts.
#
# A lane whose toolchain is absent may only be skipped when this file WAIVES it, with a reason.
# Absence is then a recorded decision rather than an accident of the runner image. Delete a waiver
# and the lane refuses to pass on a machine without its toolchain.

[rustc]
waived = true
reason = "The waiver rests on the lane's own dynamic detection, NOT on a claim about any runner image. It takes effect only where rustc is genuinely absent at run time; wherever rustc IS present - every developer machine with cargo, and any runner whose image carries a Rust toolchain - the arm runs and the waiver is inert, so waiving costs nothing there. This chunk did NOT verify what the GitHub-hosted ubuntu-latest image ships, and an earlier version of this reason asserted it carries no Rust toolchain, which was WRONG and which nothing here could check; do not restore that claim or any other statement about a runner's contents, because this file cannot verify one. What is waived is the REQUIREMENT that rustc be present, and the ground is that the property the rustc arm proves - that a host which NESTS block comments is not swallowed by an unbalanced open - is asserted wherever the toolchain exists, while the tsc arm covers the non-nesting half unconditionally and cannot be skipped anywhere. Set waived = false to require rustc everywhere, which is the right change if a nesting-host corruption is ever observed in the field."
