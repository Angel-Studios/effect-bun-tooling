# AUTOGENERATED by scripts/check-file-size.sh --update-baseline.
# Edit the rule body by hand if the regex/message changes; let the script
# regenerate the `ignores:` list. The list is a ratchet — never add entries to
# silence a new offender. Decompose the file instead.
id: no-oversize-file
language: TypeScript
severity: warning
message: "File is at or over the 1000-line ceiling. Decompose into focused, single-responsibility modules in a sibling subdirectory; keep this file as a thin orchestrator that imports and composes the pieces."
note: |
  Why this rule exists: oversize files inflate every agent's read context with
  code that rarely relates to the task at hand. The 1000-line ceiling caps the
  context an agent must hold to reason about a single file.

  How to decompose:
    1. Identify cohesive groups of pure functions or types in the file.
    2. Extract each group into its own module under a sibling directory
       (e.g., big-service.ts -> big-service/{group-a.ts,group-b.ts,...}).
    3. Reduce the original file to imports + composition.
    4. Run `pnpm tsc` and `pnpm test:unit:once` to confirm no behavior change.
    5. After the decomposition lands, regenerate the baseline:
         pnpm lint:size:update

  See CLAUDE.md > Coding Style for the orchestrator-and-pieces pattern.
metadata:
  enforces: "TypeScript files stay under the 1000-line ceiling; oversize files are decomposed and the ignores baseline only ratchets down"
  origin: "pre-ledger (backfilled C1)"
rule:
  kind: program
  regex: "(?:\\n[^\\n]*){1000,}"
# Retargeted to THIS repo's source roots during assimilation. The ported globs named
# `apps/**`, which does not exist here: a rule scoped only to it scanned ZERO files while
# still appearing in the corpus, which reads exactly like a rule with nothing to report.
files:
  - "packages/**/*.ts"
  - "scripts/**/*.ts"
  - "tools/**/*.ts"
  - "__e2e__/**/*.ts"
ignores:
  - "**/*.d.ts"
  - "**/__snapshots__/**"
  - "**/fixtures/**"
  - "tools/lint-claude-md/lint-claude-md.test.ts"
  - "tools/lint-claude-md/lint-claude-md.ts"
