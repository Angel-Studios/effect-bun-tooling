# bun is the only runtime this repo executes. Neither of the settings below is a preference; each
# closes a path that silently shells out to node.

# Run package bins with bun. A bin like `node_modules/.bin/tsc` carries a `#!/usr/bin/env node`
# shebang, which `bun run` would otherwise honour by spawning node.
[run]
bun = true

[test]
onlyFailures = true
root = "scripts"

# Never run a dependency's lifecycle script. bun ships a default list of trusted packages whose
# postinstall it will run, and `msgpackr-extract` — pulled in transitively by effect — is on it;
# its postinstall spawns node through `node-gyp-build-optional-packages`. Nothing here needs a
# native build: that package is an optional accelerator with a pure-JS fallback.
# An empty `trustedDependencies` array in package.json does NOT do this — bun reads `[]` as unset.
[install]
ignoreScripts = true
